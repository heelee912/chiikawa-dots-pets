<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiikawa Dots Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #fff6ea; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
// Promo motion graphic for Chiikawa Dots Pets (eleven pets).
//
// Every frame is a pure function of time (renderAt(ms)), so promo/render.py can step
// a 10 ms clock and export frame-exact video while a browser can also play it live.
// URL parameters: ?lang=ko|en|ja picks the caption language, ?export stops live
// playback, ?calm freezes the ambient background (used for the smaller README GIF).
//
// Sprite rules (the pets are owner-approved and must not change):
// - cells come straight from pets/<id>/spritesheet.png at an integer 2x scale with
//   nearest-neighbor sampling and integer positions
// - every frame keeps the hold time recorded for that pet (promo/cast.json)
// - a pet only changes motion at the end of a full cycle, or while a wipe hides it

const params = new URLSearchParams(location.search);
const LANG = ['ko', 'en', 'ja'].includes(params.get('lang')) ? params.get('lang') : 'ko';
const CALM = params.has('calm');

const W = 1920, H = 1080;
const CELL_W = 192, CELL_H = 208, FEET_IN_CELL = 198;
const SCALE = 2;
const DURATION_MS = 43000;

const STATE_ROWS = { idle: 0, 'running-right': 1, 'running-left': 2, waving: 3, jumping: 4, failed: 5, waiting: 6, running: 7, review: 8 };

// ---------- copy ----------
const COPY = {
  ko: {
    font: '"Jua", "Malgun Gothic", sans-serif',
    subtitle: '치이카와 친구들 11명이 Codex 데스크톱 펫으로',
    run: '화면 위를 뛰어다니고',
    meet: '친구들을 소개할게요',
    states: 'Codex 작업 상태마다 다른 모션',
    look: '16방향으로 두리번두리번',
    outro: '지금 데스크톱에 데려가세요',
    footer: '비공식 팬 제작물 · Chiikawa © Nagano',
    stateLabels: { running: '작업 중', waiting: '기다리는 중', review: '검토 중', failed: '앗, 실패', jumping: '완료!' },
    name: pet => pet.nameKo, subName: pet => pet.nameEn,
  },
  en: {
    font: '"Fredoka", "Segoe UI", sans-serif',
    subtitle: 'Eleven Chiikawa friends as Codex desktop pets',
    run: 'They run across your screen',
    meet: 'Meet all eleven',
    states: 'A motion for every Codex state',
    look: 'They look around in 16 directions',
    outro: 'Bring them to your desktop',
    footer: 'Unofficial fan work · Chiikawa © Nagano',
    stateLabels: { running: 'Working', waiting: 'Waiting for you', review: 'Reviewing', failed: 'Oops, failed', jumping: 'Done!' },
    name: pet => pet.nameEn, subName: pet => pet.nameJa,
  },
  ja: {
    font: '"M PLUS Rounded 1c", "Yu Gothic", sans-serif',
    subtitle: 'ちいかわの仲間11人がCodexのデスクトップペットに',
    run: '画面の上を走りまわって',
    meet: '仲間たちをご紹介',
    states: 'Codexの作業状態ごとにちがう動き',
    look: '16方向をきょろきょろ',
    outro: 'いますぐデスクトップへ',
    footer: '非公式ファンメイド · Chiikawa © Nagano',
    stateLabels: { running: '作業中', waiting: 'まってるよ', review: 'レビュー中', failed: 'あっ、失敗', jumping: 'できた！' },
    name: pet => pet.nameJa, subName: pet => pet.nameEn,
  },
}[LANG];
const FONT_EN = '"Fredoka", "Segoe UI", sans-serif';
const JA_NAMES = {
  chiikawa: 'ちいかわ', hachiware: 'ハチワレ', usagi: 'うさぎ', momonga: 'モモンガ', shisa: 'シーサー', rakko: 'ラッコ',
  kurimanju: 'くりまんじゅう', siren: 'セイレーン', furuhonya: '古本屋', anoko: 'あのこ', dekatsuyo: 'でかつよ',
};

const INK = '#5a463d';
const INK_SOFT = '#9a8479';
const STATE_COLORS = { running: '#7fb0de', waiting: '#efb24f', review: '#ad95e0', failed: '#ec8c8c', jumping: '#77c99a' };

// ---------- helpers ----------
const clamp01 = v => Math.max(0, Math.min(1, v));
const progress = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInCubic = k => k * k * k;
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeOutElastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const presence = (t, inMs, outMs, fade = 380) => Math.min(easeOutCubic(progress(t, inMs, inMs + fade)), 1 - easeInCubic(progress(t, outMs - fade, outMs)));
function seededRandom(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

// ---------- cast and timing ----------
let CAST = [];
const sheets = {};

function cycleMs(pet, state) { return pet.holdsMs[state].reduce((a, b) => a + b, 0); }

function columnAt(holds, localMs) {
  const total = holds.reduce((a, b) => a + b, 0);
  let t = ((localMs % total) + total) % total;
  for (let i = 0; i < holds.length; i++) { if (t < holds[i]) return i; t -= holds[i]; }
  return holds.length - 1;
}

// Turns a list of {t, state, mode} requests into exact segments. "cycle" waits for the
// running motion to finish its current loop, "restart" switches at once (only used while
// the pet is hidden or appearing), "look" segments are static poses and switch at once.
function buildTrack(pet, events) {
  const segments = [];
  let current = null;
  for (const ev of events) {
    let switchAt = ev.t;
    if (current && ev.mode === 'cycle' && current.state !== 'look') {
      const length = cycleMs(pet, current.state);
      const loops = Math.max(1, Math.ceil((ev.t - current.start) / length));
      switchAt = current.start + loops * length;
    }
    if (current) { current.end = switchAt; segments.push(current); }
    current = { state: ev.state, start: switchAt, end: Infinity };
  }
  if (current) segments.push(current);
  return segments;
}

function segmentAt(track, t) {
  for (const seg of track) if (t >= seg.start && t < seg.end) return seg;
  return null;
}

// ---------- layout ----------
// A two-row group photo: the back row stands higher so every face stays visible.
const FORMATION = {
  momonga: [210, 680], kurimanju: [510, 680], rakko: [810, 680], dekatsuyo: [1110, 680], furuhonya: [1410, 680], anoko: [1710, 680],
  siren: [300, 950], chiikawa: [630, 950], hachiware: [960, 950], usagi: [1290, 950], shisa: [1620, 950],
};
const DRAW_ORDER = ['momonga', 'kurimanju', 'rakko', 'dekatsuyo', 'furuhonya', 'anoko', 'siren', 'chiikawa', 'hachiware', 'usagi', 'shisa'];
const REVEAL_ORDER = ['hachiware', 'chiikawa', 'usagi', 'siren', 'shisa', 'rakko', 'dekatsuyo', 'kurimanju', 'furuhonya', 'momonga', 'anoko'];

const T = {
  revealStart: 900, revealStep: 130,
  runStart: 5300, runTurn: 9100, runStop: 11500,
  wipe1: 12500, wipe2: 22500, wipeHalf: 320,
  statesIdle: 22500, states: [['running', 23000], ['waiting', 24800], ['review', 26600], ['failed', 28400], ['jumping', 30200]], statesEnd: 32000,
  look: 32400, lookEnd: 37000,
  outro: 37000, outroJump: 37500,
};
const revealTime = id => T.revealStart + REVEAL_ORDER.indexOf(id) * T.revealStep;

const TRACKS = {};
function buildTracks() {
  for (const pet of CAST) {
    const reveal = revealTime(pet.id);
    const order = DRAW_ORDER.indexOf(pet.id);
    TRACKS[pet.id] = buildTrack(pet, [
      { t: reveal, state: 'jumping', mode: 'restart' },
      { t: reveal + 1, state: 'idle', mode: 'cycle' },
      { t: T.runStart, state: 'running-right', mode: 'cycle' },
      { t: T.runTurn, state: 'running-left', mode: 'cycle' },
      { t: T.runStop, state: 'idle', mode: 'cycle' },
      { t: T.statesIdle, state: 'idle', mode: 'restart' },
      ...T.states.map(([state, t]) => ({ t, state, mode: 'cycle' })),
      { t: T.statesEnd, state: 'idle', mode: 'cycle' },
      { t: T.look, state: 'look', mode: 'cycle' },
      { t: T.lookEnd, state: 'idle', mode: 'restart' },
      { t: T.outroJump + order * 70, state: 'jumping', mode: 'cycle' },
      { t: T.outroJump + order * 70 + 1, state: 'idle', mode: 'cycle' },
    ]);
  }
}

// ---------- ground scroll for the running parade ----------
// Positive velocity moves the ground left, so the pets appear to run right.
function groundVelocity(t) {
  const v = 0.62;
  if (t < T.runStart) return 0;
  if (t < T.runStart + 700) return v * easeInOutCubic(progress(t, T.runStart, T.runStart + 700));
  if (t < T.runTurn) return v;
  if (t < T.runTurn + 900) return lerp(v, -v, easeInOutCubic(progress(t, T.runTurn, T.runTurn + 900)));
  if (t < T.runStop) return -v;
  if (t < T.runStop + 700) return -v * (1 - easeInOutCubic(progress(t, T.runStop, T.runStop + 700)));
  return 0;
}
const SCROLL = (() => {
  const steps = DURATION_MS / 10 + 2;
  const table = new Float64Array(steps);
  for (let i = 1; i < steps; i++) table[i] = table[i - 1] + groundVelocity((i - 1) * 10) * 10;
  return table;
})();
const scrollAt = t => { const i = Math.max(0, Math.min(SCROLL.length - 2, Math.floor(t / 10))); return lerp(SCROLL[i], SCROLL[i + 1], (t - i * 10) / 10); };

// ---------- drawing primitives ----------
function drawText(text, x, y, { font = COPY.font, size, color = INK, alpha = 1, weight = '', align = 'center' }) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPill(cx, cy, w, h, fill, { alpha = 1, stroke = null, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  if (shadow) { ctx.shadowColor = 'rgba(122, 90, 70, 0.16)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 8; }
  roundedRect(cx - w / 2, cy - h / 2, w, h, h / 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}

function withScale(cx, cy, s, fn) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore();
}

function drawCell(petId, row, column, feetX, feetY) {
  const left = Math.round(feetX - CELL_W * SCALE / 2);
  const top = Math.round(feetY - FEET_IN_CELL * SCALE);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheets[petId], column * CELL_W, row * CELL_H, CELL_W, CELL_H, left, top, CELL_W * SCALE, CELL_H * SCALE);
  ctx.imageSmoothingEnabled = true;
}

function drawShadow(x, y, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = 0.15 * alpha;
  ctx.fillStyle = '#7b5d4e';
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 128, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---------- background ----------
const BLOBS = [
  { x: 0.18, y: 0.28, r: 620, color: [251, 211, 220], phase: 0 },
  { x: 0.82, y: 0.22, r: 560, color: [207, 226, 245], phase: 2.1 },
  { x: 0.55, y: 0.82, r: 700, color: [251, 233, 180], phase: 4.2 },
];
const DOTS = (() => {
  const rand = seededRandom(11);
  const palette = ['#fbd3dc', '#cfe2f5', '#fbe9b4', '#e4dcf6', '#d7efe0'];
  return Array.from({ length: 36 }, () => ({ x: rand() * W, y: rand() * H * 0.62, r: 6 + rand() * 26, color: palette[Math.floor(rand() * palette.length)], depth: 0.25 + rand() * 0.5, wobble: rand() * 6.28 }));
})();
const GROUND_MARKS = (() => {
  const rand = seededRandom(5);
  return Array.from({ length: 26 }, (_, i) => ({ x: i * 150 + rand() * 60, lane: i % 2, kind: Math.floor(rand() * 3) }));
})();

function drawBackground(t) {
  const ambient = CALM ? 0 : t;
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#fff8ee');
  gradient.addColorStop(1, '#fdf0ec');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  for (const blob of BLOBS) {
    const x = blob.x * W + Math.sin(ambient / 5200 + blob.phase) * 70;
    const y = blob.y * H + Math.cos(ambient / 6100 + blob.phase) * 50;
    const g = ctx.createRadialGradient(x, y, 0, x, y, blob.r);
    g.addColorStop(0, `rgba(${blob.color.join(',')},0.55)`);
    g.addColorStop(1, `rgba(${blob.color.join(',')},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // the floor: a soft plane that the group stands on
  const floor = ctx.createLinearGradient(0, 540, 0, H);
  floor.addColorStop(0, 'rgba(255,255,255,0)');
  floor.addColorStop(0.35, 'rgba(255,255,255,0.65)');
  floor.addColorStop(1, 'rgba(255,244,236,0.9)');
  ctx.fillStyle = floor;
  ctx.fillRect(0, 540, W, H - 540);

  const scroll = scrollAt(t);
  ctx.globalAlpha = 0.5;
  for (const dot of DOTS) {
    const span = W + 160;
    const x = (((dot.x - scroll * dot.depth + Math.sin(ambient / 2400 + dot.wobble) * 10) % span) + span) % span - 80;
    ctx.fillStyle = dot.color;
    ctx.beginPath(); ctx.arc(x, dot.y, dot.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ground marks only show while the parade is moving
  const groundAlpha = Math.min(presence(t, T.runStart - 200, T.runStop + 1100, 500), 1);
  if (groundAlpha > 0) {
    const span = 26 * 150;
    for (const mark of GROUND_MARKS) {
      const y = mark.lane ? 970 : 700;
      const x = (((mark.x - scroll) % span) + span) % span - 200;
      ctx.save();
      ctx.globalAlpha = groundAlpha * 0.55;
      ctx.strokeStyle = '#e3cdbd'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      if (mark.kind === 0) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 46, y); ctx.stroke(); }
      if (mark.kind === 1) { for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(x + k * 9, y + 6); ctx.lineTo(x + k * 13, y - 10); ctx.stroke(); } }
      if (mark.kind === 2) { ctx.fillStyle = '#ead8ca'; ctx.beginPath(); ctx.ellipse(x, y, 10, 6, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }
}

// ---------- captions ----------
function drawCaption(t, inMs, outMs, text, y = 112) {
  const alpha = presence(t, inMs, outMs, 420);
  if (alpha <= 0) return;
  const rise = (1 - easeOutCubic(progress(t, inMs, inMs + 560))) * 28;
  drawText(text, W / 2, y + rise, { size: 74, alpha, weight: LANG === 'ja' ? 800 : (LANG === 'en' ? 600 : '') });
}

// "Chiikawa Dots Pets" with letters that drop in one after another.
function drawTitle(t, inMs, outMs, y, size) {
  const alpha = presence(t, inMs, outMs, 420);
  if (alpha <= 0) return;
  const title = 'Chiikawa Dots Pets';
  ctx.save();
  ctx.font = `700 ${size}px ${FONT_EN}`;
  const widths = [...title].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  const palette = ['#5a463d', '#5a463d', '#5a463d'];
  [...title].forEach((ch, i) => {
    const k = easeOutBack(progress(t, inMs + i * 28, inMs + i * 28 + 520));
    const drop = (1 - k) * -60;
    ctx.globalAlpha = alpha * clamp01(k * 1.4);
    ctx.fillStyle = ch === ' ' ? 'transparent' : palette[i % palette.length];
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, y + drop);
    x += widths[i];
  });
  ctx.restore();
}

// ---------- reveal and effects ----------
function revealRadius(id, t) {
  const r = revealTime(id);
  const k = progress(t, r - 100, r + 360);
  return k >= 1 ? null : Math.max(0, easeOutBack(k)) * 260;
}

function drawRevealBurst(pet, t) {
  const r = revealTime(pet.id);
  const k = progress(t, r - 100, r + 620);
  if (k <= 0 || k >= 1) return;
  const [x, y] = FORMATION[pet.id];
  const cy = y - 170;
  ctx.save();
  ctx.globalAlpha = (1 - k) * 0.9;
  ctx.strokeStyle = pet.color;
  ctx.lineWidth = 12 * (1 - k) + 2;
  ctx.beginPath(); ctx.arc(x, cy, 70 + easeOutCubic(k) * 200, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + 0.3;
    const d = 120 + easeOutCubic(k) * 150;
    ctx.fillStyle = pet.color;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, 9 * (1 - k) + 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Dust puffs come from each runner's own run segment, so nothing is stored between frames.
function drawDust(pet, t) {
  const [x, y] = FORMATION[pet.id];
  for (const seg of TRACKS[pet.id]) {
    if (seg.state !== 'running-right' && seg.state !== 'running-left') continue;
    const behind = seg.state === 'running-right' ? -1 : 1;
    const first = Math.ceil(seg.start / 170) * 170;
    for (let spawn = first; spawn < Math.min(seg.end, t); spawn += 170) {
      const age = t - spawn;
      if (age > 620) continue;
      const k = age / 620;
      const px = x + behind * 110 - (scrollAt(t) - scrollAt(spawn));
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.55;
      ctx.fillStyle = '#ecdccf';
      ctx.beginPath(); ctx.arc(px, y - 8 - k * 30, 11 + k * 22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

// ---------- the group photo scenes ----------
const STAR_ORBIT = { cx: 960, cy: 600, rx: 860, ry: 400 };
function starAt(t) {
  const k = progress(t, T.look + 200, T.lookEnd - 200);
  const angle = -Math.PI / 2 + easeInOutCubic(k) * Math.PI * 2;
  return { x: STAR_ORBIT.cx + Math.cos(angle) * STAR_ORBIT.rx, y: STAR_ORBIT.cy + Math.sin(angle) * STAR_ORBIT.ry };
}

function lookCell(pet, t) {
  const [x, y] = FORMATION[pet.id];
  const star = starAt(t);
  const degrees = (Math.atan2(star.x - x, -(star.y - (y - 170))) * 180 / Math.PI + 360) % 360; // 0 = up, clockwise
  const index = Math.round(degrees / 22.5) % 16;
  return { row: 9 + Math.floor(index / 8), column: index % 8 };
}

function formationVisible(t) { return t < T.wipe1 || t >= T.wipe2; }

function drawFormation(t) {
  if (!formationVisible(t)) return;
  for (const id of DRAW_ORDER) {
    const pet = CAST.find(p => p.id === id);
    if (t < revealTime(id) - 100) continue;
    const seg = segmentAt(TRACKS[id], t);
    if (!seg) continue;
    const [x, y] = FORMATION[id];
    const fade = 1 - easeInCubic(progress(t, DURATION_MS - 650, DURATION_MS - 80));
    let cell;
    if (seg.state === 'look') cell = lookCell(pet, t);
    else cell = { row: STATE_ROWS[seg.state], column: columnAt(pet.holdsMs[seg.state], t - seg.start) };
    ctx.save();
    ctx.globalAlpha = fade;
    const r = revealRadius(id, t);
    if (r !== null) { ctx.beginPath(); ctx.arc(x, y - 170, r, 0, Math.PI * 2); ctx.clip(); }
    drawShadow(x, y, fade);
    drawCell(id, cell.row, cell.column, x, y);
    ctx.restore();
  }
}

function drawStar(t) {
  const alpha = presence(t, T.look, T.lookEnd, 300);
  if (alpha <= 0) return;
  for (let i = 1; i <= 10; i++) {
    const p = starAt(t - i * 32);
    ctx.save(); ctx.globalAlpha = alpha * (1 - i / 11) * 0.45; ctx.fillStyle = '#f6b8c3';
    ctx.beginPath(); ctx.arc(p.x, p.y, 15 - i, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  const { x, y } = starAt(t);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(t / 380);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? 40 : 17; const a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
  ctx.fillStyle = '#ffd36e'; ctx.fill();
  ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#e7a93a'; ctx.stroke();
  ctx.restore();
}

function stateIndexAt(t) {
  let index = -1;
  T.states.forEach(([, start], i) => { if (t >= start) index = i; });
  return index;
}

function drawStatusPill(t) {
  const alpha = presence(t, T.states[0][1] - 300, T.statesEnd + 300, 300);
  if (alpha <= 0) return;
  const index = Math.max(0, stateIndexAt(t));
  const [state, start] = T.states[index];
  const label = COPY.stateLabels[state];
  const color = STATE_COLORS[state];
  const cy = 214;
  const pop = index === 0 ? easeOutBack(progress(t, start - 300, start + 200)) : 0.86 + 0.14 * easeOutElastic(progress(t, start, start + 700));
  withScale(W / 2, cy, pop, () => {
    drawPill(W / 2, cy, 520, 92, '#ffffff', { alpha });
    const pulse = 0.5 + 0.5 * Math.sin(t / 150);
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha * (0.22 + pulse * 0.22);
    ctx.beginPath(); ctx.arc(W / 2 - 200, cy, 24 + pulse * 6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(W / 2 - 200, cy, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const textAlpha = alpha * easeOutCubic(progress(t, start, start + 240));
    drawText(label, W / 2 + 22, cy - 1, { size: 46, alpha: textAlpha, weight: LANG === 'ko' ? '' : 700 });
  });
  T.states.forEach(([chipState], i) => {
    const active = i === index;
    const x = W / 2 + (i - (T.states.length - 1) / 2) * 42;
    ctx.save();
    ctx.globalAlpha = alpha * (active ? 1 : 0.4);
    ctx.fillStyle = active ? STATE_COLORS[chipState] : '#cdbbb0';
    roundedRect(x - (active ? 17 : 7), 276 - 7, active ? 34 : 14, 14, 7);
    ctx.fill();
    ctx.restore();
  });
}

const CONFETTI = (() => {
  const rand = seededRandom(42);
  const palette = ['#f2a3b3', '#7fb0de', '#efc75e', '#77c99a', '#ad95e0', '#f0a066'];
  return Array.from({ length: 120 }, () => ({ angle: -Math.PI / 2 + (rand() - 0.5) * Math.PI * 1.3, speed: 0.7 + rand() * 1.0, spin: (rand() - 0.5) * 0.02, size: 10 + rand() * 14, color: palette[Math.floor(rand() * palette.length)], x: W / 2 + (rand() - 0.5) * 1500 }));
})();
function drawConfetti(elapsed, originY) {
  if (elapsed < 0 || elapsed > 1700) return;
  for (const p of CONFETTI) {
    const x = p.x + Math.cos(p.angle) * p.speed * elapsed;
    const y = originY + Math.sin(p.angle) * p.speed * elapsed + 0.0011 * elapsed * elapsed;
    ctx.save();
    ctx.globalAlpha = 1 - clamp01((elapsed - 1100) / 600);
    ctx.translate(x, y); ctx.rotate(p.spin * elapsed);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  }
}

// ---------- roll call carousel ----------
const CAROUSEL = { y: 820, spacing: 470, start: T.wipe1, holdMs: 600, glideMs: 300 };
function carouselTravel(t) {
  const local = t - CAROUSEL.start - 260;
  if (local <= 0) return 0;
  const step = CAROUSEL.holdMs + CAROUSEL.glideMs;
  const k = Math.floor(local / step);
  const inStep = local - k * step;
  const glide = inStep < CAROUSEL.holdMs ? 0 : easeInOutCubic((inStep - CAROUSEL.holdMs) / CAROUSEL.glideMs);
  return Math.min(CAST.length - 1, k + glide);
}

function drawCarousel(t) {
  if (formationVisible(t)) return;
  const travel = carouselTravel(t);
  const focus = Math.round(travel);
  const settle = 1 - Math.abs(travel - focus) * 2;

  // spotlight behind the focused pet
  const pet = CAST[focus];
  ctx.save();
  const glow = ctx.createRadialGradient(W / 2, CAROUSEL.y - 180, 30, W / 2, CAROUSEL.y - 180, 330);
  glow.addColorStop(0, 'rgba(255,255,255,0.95)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.35 + 0.35 * clamp01(settle);
  ctx.strokeStyle = pet.color; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(W / 2, CAROUSEL.y - 190, 230, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  CAST.forEach((p, i) => {
    const x = Math.round(W / 2 + (i - travel) * CAROUSEL.spacing);
    if (x < -260 || x > W + 260) return;
    const holds = p.holdsMs.waving;
    const column = columnAt(holds, t - CAROUSEL.start);
    const distance = Math.abs(i - travel);
    ctx.save();
    ctx.globalAlpha = 1 - clamp01((distance - 1.2) / 1.6) * 0.55;
    drawShadow(x, CAROUSEL.y);
    drawCell(p.id, STATE_ROWS.waving, column, x, CAROUSEL.y);
    ctx.restore();
  });

  // name card
  const stepStart = CAROUSEL.start + 260 + focus * (CAROUSEL.holdMs + CAROUSEL.glideMs) - CAROUSEL.glideMs / 2;
  const pop = easeOutBack(progress(t, stepStart, stepStart + 380));
  const cardY = CAROUSEL.y + 92;
  withScale(W / 2, cardY, 0.6 + 0.4 * pop, () => {
    drawPill(W / 2, cardY, 440, 110, '#ffffff', { stroke: pet.color });
    drawText(COPY.name(pet), W / 2, cardY - 16, { size: LANG === 'ja' && COPY.name(pet).length > 5 ? 40 : 50, weight: LANG === 'ko' ? '' : 700 });
    drawText(COPY.subName(pet), W / 2, cardY + 30, { font: LANG === 'en' ? '"M PLUS Rounded 1c", sans-serif' : FONT_EN, size: 24, color: INK_SOFT, weight: 600 });
  });
  drawText(`${String(focus + 1).padStart(2, '0')} / ${CAST.length}`, W / 2 + 330, cardY - 36, { font: FONT_EN, size: 26, color: pet.color, weight: 700 });
}

// ---------- wipes ----------
const WIPE_COLORS = ['#fbd3dc', '#cfe2f5', '#fbe9b4'];
function drawWipe(t, mid) {
  const start = mid - T.wipeHalf, end = mid + T.wipeHalf;
  if (t < start || t > end) return;
  const R = 1250;
  WIPE_COLORS.forEach((color, i) => {
    const delay = i * 60;
    ctx.save();
    ctx.fillStyle = color;
    if (t < mid) {
      const r = easeInCubic(progress(t, start + delay, mid)) * R;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.fill();
    } else {
      const hole = easeOutCubic(progress(t, mid + (2 - i) * 60, end)) * R;
      ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, hole, 0, Math.PI * 2, true); ctx.fill('evenodd');
    }
    ctx.restore();
  });
}

// ---------- outro ----------
function drawOutro(t) {
  drawTitle(t, T.outro + 100, DURATION_MS - 200, 96, 112);
  drawText(COPY.outro, W / 2, 182, { size: 38, color: INK_SOFT, alpha: presence(t, T.outro + 500, DURATION_MS - 200, 400), weight: LANG === 'ko' ? '' : 700 });
  const urlAlpha = presence(t, T.outro + 800, DURATION_MS - 200, 400);
  const pop = easeOutBack(progress(t, T.outro + 800, T.outro + 1300));
  withScale(W / 2, 252, pop, () => {
    drawPill(W / 2, 252, 760, 70, INK, { alpha: urlAlpha });
    drawText('github.com/heelee912/chiikawa-dots-pets', W / 2, 254, { font: FONT_EN, size: 31, color: '#fff6ea', alpha: urlAlpha, weight: 600 });
  });
}

function drawFooter(t) {
  const alpha = 0.85 * presence(t, 0, DURATION_MS - 80, 400);
  drawText(COPY.footer, W / 2, H - 34, { font: `${FONT_EN.split(',')[0]}, ${COPY.font}`, size: 22, color: '#b8a59a', alpha, weight: 600 });
}

// ---------- composition ----------
function renderAt(t) {
  t = ((t % DURATION_MS) + DURATION_MS) % DURATION_MS;
  drawBackground(t);

  // intro
  drawTitle(t, 150, 5000, 128, 132);
  drawText(COPY.subtitle, W / 2, 238, { size: 46, color: INK_SOFT, alpha: presence(t, 700, 5000, 420), weight: LANG === 'ko' ? '' : 700 });

  drawCaption(t, T.runStart - 100, T.wipe1 - 200, COPY.run);
  drawCaption(t, T.wipe1 + 200, T.wipe2 - 200, COPY.meet);
  drawCaption(t, T.statesIdle + 250, T.statesEnd + 350, COPY.states);
  drawCaption(t, T.look + 50, T.lookEnd + 50, COPY.look);
  drawStatusPill(t);

  if (formationVisible(t)) {
    for (const pet of CAST) drawDust(pet, t);
    for (const pet of CAST) drawRevealBurst(pet, t);
  }
  drawFormation(t);
  drawCarousel(t);
  drawStar(t);
  const jumpStart = T.states[4][1];
  if (t >= jumpStart && t < jumpStart + 1800) drawConfetti(t - jumpStart - 200, 560);
  if (t >= T.outroJump) drawConfetti(t - T.outroJump - 300, 600);
  if (t >= T.outro) drawOutro(t);

  drawWipe(t, T.wipe1);
  drawWipe(t, T.wipe2);
  drawFooter(t);
}

// render.py uses this to land GIF frames exactly on sprite changes.
function spriteSignatureAt(t) {
  if (!formationVisible(t)) {
    const travel = carouselTravel(t);
    return 'c' + CAST.map(p => columnAt(p.holdsMs.waving, t - CAROUSEL.start)).join('') + ':' + Math.round(travel * 100);
  }
  return CAST.map(pet => {
    const seg = segmentAt(TRACKS[pet.id], t);
    if (!seg || t < revealTime(pet.id) - 100) return '-';
    if (seg.state === 'look') { const c = lookCell(pet, t); return `${c.row}${c.column}`; }
    return `${STATE_ROWS[seg.state]}${columnAt(pet.holdsMs[seg.state], t - seg.start)}`;
  }).join('|');
}

async function load() {
  const data = await (await fetch('cast.json')).json();
  CAST = data.cast.map(p => ({ ...p, nameJa: JA_NAMES[p.id] }));
  await Promise.all(CAST.map(p => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { sheets[p.id] = img; resolve(); };
    img.onerror = () => reject(new Error(`missing spritesheet for ${p.id}`));
    img.src = `../pets/${p.id}/spritesheet.png`;
  })));
  buildTracks();
  const allText = Object.values(COPY).filter(v => typeof v === 'string').join('') + Object.values(COPY.stateLabels).join('') +
    CAST.map(p => COPY.name(p) + COPY.subName(p)).join('');
  await Promise.all([
    document.fonts.load(`74px ${COPY.font}`, allText),
    document.fonts.load(`700 74px ${COPY.font}`, allText),
    document.fonts.load(`700 80px ${FONT_EN}`, 'Chiikawa Dots Pets 0123456789/ github.com'),
    document.fonts.load(`600 40px ${FONT_EN}`, allText),
    document.fonts.load(`600 24px "M PLUS Rounded 1c"`, Object.values(JA_NAMES).join('')),
  ]);
  await document.fonts.ready;
  return true;
}

window.PROMO_DURATION_MS = DURATION_MS;
window.renderAt = renderAt;
window.spriteSignatureAt = spriteSignatureAt;
window.promoReady = load();
document.documentElement.lang = LANG;

if (!params.has('export')) {
  window.promoReady.then(() => {
    const startedAt = performance.now();
    const tick = now => { renderAt(now - startedAt); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
