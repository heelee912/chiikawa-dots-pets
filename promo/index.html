<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiikawa Dots Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #fbf3ef; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
// Promo motion graphic for Chiikawa Dots Pets: one story on one desktop.
//
// Every frame is a pure function of time (renderAt(ms)), so promo/render.py can step
// a 10 ms clock and export frame-exact video while a browser can also play it live.
// URL parameters: ?lang=ko|en|ja picks the caption language, ?export stops live playback.
//
// Story: a window opens and Chiikawa pops onto it -> the friends are introduced one by
// one -> all eleven stand beside the window and react to its work together, changing
// under one shared puff -> the cursor minimizes the window and everyone runs to the middle
// -> they follow the cursor around -> it reopens the window as the title card and
// everyone jumps on the same beat.
//
// Sprite rules (the pets are owner-approved and must not change):
// - cells come straight from pets/<id>/spritesheet.png at integer scales (1x, 2x)
//   with nearest-neighbor sampling and integer positions
// - every frame keeps the hold time recorded for that pet (promo/cast.json)
// - a pet only changes motion at the end of a full cycle, from a still look pose,
//   or while a puff hides it

const params = new URLSearchParams(location.search);
const LANG = ['ko', 'en', 'ja'].includes(params.get('lang')) ? params.get('lang') : 'ko';

const W = 1920, H = 1080;
const CELL_W = 192, CELL_H = 208, FEET_IN_CELL = 198;
const DURATION_MS = 43000;
const ROWS = { idle: 0, 'running-right': 1, 'running-left': 2, waving: 3, jumping: 4, failed: 5, waiting: 6, running: 7, review: 8 };
const IDS = ['chiikawa', 'hachiware', 'usagi', 'momonga', 'shisa', 'rakko', 'kurimanju', 'siren', 'furuhonya', 'anoko', 'dekatsuyo'];

// ---------- copy ----------
const COPY = {
  ko: {
    font: '"Jua", "Malgun Gothic", sans-serif', weight: '',
    subtitle: '치이카와 친구들 11명이 데스크톱 펫으로',
    meet: '친구들을 소개할게요',
    states: '작업 상태에 맞춰 반응하고',
    look: '커서를 따라 다 같이 두리번',
    outro: '데스크톱에 데려가 보세요',
    footer: '비공식 팬 제작물 · Chiikawa © Nagano',
    chip: { running: '작업 중', waiting: '확인이 필요해요', review: '검토 중', failed: '앗, 실패', jumping: '완료!' },
    ask: '변경 사항을 적용할까요?', yes: '적용', no: '취소',
    failedLine: '테스트 1개 실패', doneLine: '모든 작업 완료',
    name: p => p.nameKo, sub: p => p.nameEn,
  },
  en: {
    font: '"Fredoka", "Segoe UI", sans-serif', weight: 600,
    subtitle: 'Eleven Chiikawa friends as desktop pets',
    meet: 'Meet the friends',
    states: 'They react to what Codex is doing',
    look: 'Everyone follows your cursor',
    outro: 'Bring them to your desktop',
    footer: 'Unofficial fan work · Chiikawa © Nagano',
    chip: { running: 'Working', waiting: 'Needs your OK', review: 'Reviewing', failed: 'Oops, failed', jumping: 'Done!' },
    ask: 'Apply these changes?', yes: 'Apply', no: 'Cancel',
    failedLine: '1 test failed', doneLine: 'All tasks done',
    name: p => p.nameEn, sub: p => p.nameJa,
  },
  ja: {
    font: '"M PLUS Rounded 1c", "Yu Gothic", sans-serif', weight: 800,
    subtitle: 'ちいかわの仲間11人がデスクトップペットに',
    meet: 'なかまたちをご紹介',
    states: 'Codexの作業にあわせて反応',
    look: 'みんなでカーソルをきょろきょろ',
    outro: 'デスクトップにお迎えしよう',
    footer: '非公式ファンメイド · Chiikawa © Nagano',
    chip: { running: '作業中', waiting: '確認してね', review: 'レビュー中', failed: 'あっ、失敗', jumping: 'できた！' },
    ask: '変更を適用しますか？', yes: '適用', no: 'キャンセル',
    failedLine: 'テストが1件失敗', doneLine: 'ぜんぶ完了',
    name: p => p.nameJa, sub: p => p.nameEn,
  },
}[LANG];
const FONT_EN = '"Fredoka", "Segoe UI", sans-serif';
const FONT_JA = '"M PLUS Rounded 1c", sans-serif';
const JA_NAMES = {
  chiikawa: 'ちいかわ', hachiware: 'ハチワレ', usagi: 'うさぎ', momonga: 'モモンガ', shisa: 'シーサー', rakko: 'ラッコ',
  kurimanju: 'くりまんじゅう', siren: 'セイレーン', furuhonya: '古本屋', anoko: 'あのこ', dekatsuyo: 'でかつよ',
};
const KO_NAMES = {
  chiikawa: '치이카와', hachiware: '하치와레', usagi: '우사기', momonga: '모몽가', shisa: '시사', rakko: '랏코',
  kurimanju: '쿠리만주', siren: '세이렌', furuhonya: '후루혼야', anoko: '아노코', dekatsuyo: '데카츠요',
};

const INK = '#5a463d';
const INK_SOFT = '#a08b80';
const STATE_COLORS = { running: '#7fb0de', waiting: '#efb24f', review: '#a98fe0', failed: '#ec8c8c', jumping: '#6fc496' };

// ---------- helpers ----------
const clamp01 = v => Math.max(0, Math.min(1, v));
const progress = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInCubic = k => k * k * k;
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeInOutSine = k => -(Math.cos(Math.PI * k) - 1) / 2;
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const presence = (t, inMs, outMs, fade = 380) => Math.min(easeOutCubic(progress(t, inMs, inMs + fade)), 1 - easeInCubic(progress(t, outMs - fade, outMs)));

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

// ---------- cast and motion tracks ----------
const CAST = {};
const sheets = {};
const cycleMs = (id, state) => CAST[id].holdsMs[state].reduce((a, b) => a + b, 0);
function columnAt(holds, localMs) {
  const total = holds.reduce((a, b) => a + b, 0);
  let t = ((localMs % total) + total) % total;
  for (let i = 0; i < holds.length; i++) { if (t < holds[i]) return i; t -= holds[i]; }
  return holds.length - 1;
}
// "cycle" waits for the current loop to end; "now" switches at once (from a still pose or under a puff).
function buildTrack(id, events) {
  const segments = [];
  let current = null;
  for (const ev of events) {
    let at = ev.t;
    if (current && ev.mode === 'cycle' && current.state !== 'look') {
      const length = cycleMs(id, current.state);
      at = current.start + Math.max(1, Math.ceil((ev.t - current.start) / length)) * length;
    }
    if (current) { current.end = at; segments.push(current); }
    current = { state: ev.state, start: at, end: Infinity };
  }
  segments.push(current);
  return segments;
}
const segmentAt = (track, t) => track.find(s => t >= s.start && t < s.end) || null;
function cellFor(id, seg, t, lookAt) {
  if (seg.state === 'look') return lookAt;
  return { row: ROWS[seg.state], column: columnAt(CAST[id].holdsMs[seg.state], t - seg.start) };
}

// ---------- drawing primitives ----------
function text(str, x, y, { size, color = INK, alpha = 1, align = 'center', font = COPY.font, weight = COPY.weight }) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  ctx.fillText(str, x, y); ctx.restore();
}
function textWidth(str, size, font = COPY.font, weight = COPY.weight) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(str).width; ctx.restore(); return w;
}
const fitSize = (str, size, maxWidth) => { const w = textWidth(str, size); return w > maxWidth ? Math.floor(size * maxWidth / w) : size; };
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pill(cx, cy, w, h, fill, { alpha = 1, stroke = null, shadow = true } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  if (shadow) { ctx.shadowColor = 'rgba(122,90,70,0.14)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; }
  roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.shadowColor = 'transparent';
  if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}
function withScale(cx, cy, s, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function drawCell(id, row, column, feetX, feetY, scale) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheets[id], column * CELL_W, row * CELL_H, CELL_W, CELL_H,
    Math.round(feetX - CELL_W * scale / 2), Math.round(feetY - FEET_IN_CELL * scale), CELL_W * scale, CELL_H * scale);
  ctx.imageSmoothingEnabled = true;
}
function shadow(x, y, scale, alpha = 1) {
  ctx.save(); ctx.globalAlpha = 0.14 * alpha; ctx.fillStyle = '#7b5d4e';
  ctx.beginPath(); ctx.ellipse(x, y + 3, 62 * scale, 10 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
// A soft cloud that covers a pet while it appears or changes ("pop!").
function puff(x, y, scale, t, at) {
  const k = progress(t, at - 220, at + 280);
  if (k <= 0 || k >= 1) return;
  const grow = k < 0.44 ? easeOutCubic(k / 0.44) : 1;
  const fade = k < 0.44 ? 1 : 1 - easeInCubic((k - 0.44) / 0.56);
  ctx.save(); ctx.globalAlpha = fade; ctx.fillStyle = '#ffffff';
  const cy = y - 100 * scale;
  for (const [dx, dy, r] of [[0, 0, 96], [-62, 26, 64], [62, 26, 64], [-34, -48, 58], [40, -44, 56], [0, 60, 66]]) {
    ctx.beginPath(); ctx.arc(x + dx * scale * 0.9, cy + dy * scale * 0.9, r * scale * 0.9 * grow, 0, Math.PI * 2); ctx.fill();
  }
  // a few sparkles fly out as the cloud clears
  if (k > 0.35) {
    const s = progress(k, 0.35, 1);
    ctx.globalAlpha = 1 - s; ctx.fillStyle = '#ffd36e';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + 0.4, d = (110 + s * 70) * scale;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, 6 * scale * (1 - s) + 1, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- the desktop (one setting for the whole movie) ----------
function desktop() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#fdf1ec'); g.addColorStop(1, '#eef1fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.5, H * 0.55, 60, W * 0.5, H * 0.55, 1000);
  glow.addColorStop(0, 'rgba(255,255,255,0.55)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}

// ---------- timeline ----------
const T = {
  windowIn: 250, chiikawaPop: 1300, titleIn: 600,
  carouselOut: 4300, carousel: 4800, carouselEnd: 14800,
  windowBack: 14700, castPop: 15500, stateMs: 2100,
  cursorIn: 25200, minimize: 26300, runCue: 26350,
  finale: 36000,
};
// The whole cast switches together under one shared puff, in step with the window.
const DESK_STATES = ['running', 'waiting', 'review', 'failed', 'jumping'].map((state, i) => ({ state, at: T.castPop + i * T.stateMs }));

// ---------- the window ----------
const WIN = { x: 410, w: 1100, h: 520, deskY: 470, stageY: 315, titleY: 40, titleH: 380 };
const PERCH_X = 1390;
const MINIMIZE_MS = 560;
const CHIIKAWA_RIDE_PX = 460;   // far enough below the screen that Chiikawa rides the window out of view
const DOCK_Y = H + 40;    // the minimized window drops toward the bottom edge
const MINIMIZE_BUTTON = { x: WIN.x + 60, y: WIN.stageY + 29 };

function windowTop(t) {
  if (t < T.carouselOut) return WIN.deskY + Math.round((1 - easeOutCubic(progress(t, T.windowIn, T.windowIn + 650))) * 40);
  if (t < T.windowBack) return Math.round(lerp(WIN.deskY, H + CHIIKAWA_RIDE_PX, easeInCubic(progress(t, T.carouselOut, T.carouselOut + 520))));
  return Math.round(lerp(H + 80, WIN.stageY, easeOutCubic(progress(t, T.windowBack, T.windowBack + 650))));
}
// Position, size and transform of the window, or null while it is minimized.
function windowFrame(t) {
  if (t >= T.finale) {
    const k = progress(t, T.finale, T.finale + 520);
    if (k <= 0) return null;
    const fadeOut = 1 - easeInCubic(progress(t, DURATION_MS - 650, DURATION_MS - 80));
    return { y: WIN.titleY, h: WIN.titleH, scale: 0.4 + 0.6 * easeOutBack(k), dy: 0, alpha: clamp01(k * 3) * fadeOut };
  }
  if (t >= T.minimize + MINIMIZE_MS) return null;
  const y = windowTop(t);
  if (y > H) return null;
  const k = progress(t, T.minimize, T.minimize + MINIMIZE_MS), e = easeInCubic(k);
  return {
    y, h: WIN.h, scale: 1 - 0.94 * e, dy: (DOCK_Y - (y + WIN.h / 2)) * e,
    alpha: easeOutCubic(progress(t, T.windowIn, T.windowIn + 600)) * (1 - easeInCubic(progress(k, 0.55, 1))),
  };
}

function deskStateAt(t) {
  if (t < DESK_STATES[0].at || t >= T.minimize) return null;
  let current = null;
  for (const s of DESK_STATES) if (t >= s.at) current = s;
  return current;
}

const CODE_LINES = [[0, 360], [24, 280], [24, 420], [48, 220], [48, 330], [24, 260], [0, 180], [0, 300]];
function drawWindow(t) {
  const frame = windowFrame(t);
  if (!frame) return;
  const { x, w } = WIN, { y, h } = frame;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 + frame.dy); ctx.scale(frame.scale, frame.scale); ctx.translate(-(x + w / 2), -(y + h / 2));
  ctx.globalAlpha = frame.alpha;
  ctx.save();
  ctx.shadowColor = 'rgba(90,70,60,0.16)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
  roundRect(x, y, w, h, 26); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.restore();
  ctx.save(); roundRect(x, y, w, h, 26); ctx.clip(); ctx.fillStyle = '#f7f3ef'; ctx.fillRect(x, y, w, 58); ctx.restore();
  ['#f3a7a0', '#f2cd7c', '#9bd3a6'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 34 + i * 26, y + 29, 8, 0, Math.PI * 2); ctx.fill(); });
  text('my-project', x + 130, y + 30, { size: 22, color: INK_SOFT, align: 'left', font: FONT_EN, weight: 600 });
  if (t >= T.finale) {
    drawTitleCard(t, x, y);
  } else {
    ctx.fillStyle = '#faf7f4'; ctx.fillRect(x, y + 58, 190, h - 58 - 26);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i === 1 ? '#eadfd7' : '#f0e8e2'; roundRect(x + 26, y + 96 + i * 46, 130 - (i % 3) * 22, 16, 8); ctx.fill(); }
    drawWorkContent(t, x, y);
  }
  ctx.restore();
}

function drawWorkContent(t, x, y) {
  const state = deskStateAt(t);
  const left = x + 230, top = y + 96;
  const typed = state && state.state === 'running' ? progress(t, state.at, state.at + 1800) * CODE_LINES.length : CODE_LINES.length;
  const reviewLine = state && state.state === 'review' ? Math.floor(progress(t, state.at, state.at + 1900) * CODE_LINES.length) : -1;
  CODE_LINES.forEach(([indent, width], i) => {
    const k = clamp01(typed - i);
    if (k <= 0) return;
    ctx.save(); ctx.globalAlpha *= i === reviewLine ? 1 : 0.7;
    ctx.fillStyle = ['#c9dcef', '#f1d4c4', '#e3dcef'][i % 3];
    roundRect(left + indent, top + i * 40, width * k, 18, 9); ctx.fill(); ctx.restore();
    if (state && state.state === 'review' && t > state.at + i * 220 + 200) {
      text('✓', left + indent + width + 26, top + i * 40 + 10, { size: 22, color: STATE_COLORS.review, font: FONT_EN, weight: 700, alpha: easeOutCubic(progress(t, state.at + i * 220 + 200, state.at + i * 220 + 400)) });
    }
  });
  if (!state) return;
  const local = t - state.at;
  const chipW = 260, chipX = x + WIN.w - chipW / 2 - 24, chipY = y + 29;
  withScale(chipX, chipY, 0.85 + 0.15 * easeOutBack(progress(local, 0, 420)), () => {
    pill(chipX, chipY, chipW, 40, '#ffffff', { shadow: false, stroke: '#efe6df' });
    const pulse = 0.5 + 0.5 * Math.sin(t / 160);
    ctx.save(); ctx.globalAlpha *= 0.5 + 0.5 * pulse; ctx.fillStyle = STATE_COLORS[state.state];
    ctx.beginPath(); ctx.arc(chipX - chipW / 2 + 22, chipY, 7, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    text(COPY.chip[state.state], chipX + 12, chipY + 1, { size: 21, weight: LANG === 'ko' ? '' : 700 });
  });
  const cardIn = easeOutCubic(progress(local, 250, 650));
  if (cardIn <= 0) return;
  const cardX = left, cardY = y + WIN.h - 120 + Math.round((1 - cardIn) * 16), cardW = WIN.w - 230 - 40;
  const bw = LANG === 'ko' ? '' : 700;
  ctx.save(); ctx.globalAlpha *= cardIn;
  if (state.state === 'waiting') {
    roundRect(cardX, cardY, cardW, 84, 18); ctx.fillStyle = '#fff6e3'; ctx.fill();
    text(COPY.ask, cardX + 28, cardY + 42, { size: 26, align: 'left', weight: bw });
    const noW = Math.max(104, textWidth(COPY.no, 22, COPY.font, bw) + 44), yesW = Math.max(110, textWidth(COPY.yes, 22, COPY.font, bw) + 48);
    const noX = cardX + cardW - 22 - noW / 2, yesX = noX - noW / 2 - 14 - yesW / 2;
    pill(yesX, cardY + 42, yesW, 44, STATE_COLORS.waiting, { shadow: false });
    text(COPY.yes, yesX, cardY + 43, { size: 22, color: '#ffffff', weight: bw });
    pill(noX, cardY + 42, noW, 44, '#ffffff', { shadow: false, stroke: '#efe1cf' });
    text(COPY.no, noX, cardY + 43, { size: 22, color: INK_SOFT, weight: bw });
  } else if (state.state === 'failed') {
    roundRect(cardX, cardY, cardW, 84, 18); ctx.fillStyle = '#fdeceb'; ctx.fill();
    text('×', cardX + 40, cardY + 42, { size: 34, color: STATE_COLORS.failed, font: FONT_EN, weight: 700 });
    text(COPY.failedLine, cardX + 74, cardY + 42, { size: 26, align: 'left', weight: bw });
  } else if (state.state === 'jumping') {
    roundRect(cardX, cardY, cardW, 84, 18); ctx.fillStyle = '#e9f7ee'; ctx.fill();
    text('✓', cardX + 40, cardY + 43, { size: 30, color: STATE_COLORS.jumping, font: FONT_EN, weight: 700 });
    text(COPY.doneLine, cardX + 74, cardY + 42, { size: 26, align: 'left', weight: bw });
  }
  ctx.restore();
}

// The reopened window is the closing card: title, tagline, link and an install line.
function drawTitleCard(t, x, y) {
  const cx = x + WIN.w / 2, start = T.finale + 150;
  ctx.save(); ctx.font = `700 92px ${FONT_EN}`; ctx.fillStyle = INK; ctx.textBaseline = 'middle';
  const base = ctx.globalAlpha, word = 'Chiikawa Dots Pets';
  const widths = [...word].map(ch => ctx.measureText(ch).width);
  let px = cx - widths.reduce((a, b) => a + b, 0) / 2;
  [...word].forEach((ch, i) => {
    const k = easeOutBack(progress(t, start + i * 28, start + i * 28 + 520));
    ctx.globalAlpha = base * clamp01(k * 1.5);
    ctx.fillText(ch, px, y + 128 + (1 - k) * -36); px += widths[i];
  });
  ctx.restore();
  text(COPY.outro, cx, y + 204, { size: 38, color: INK_SOFT, alpha: presence(t, start + 450, DURATION_MS, 400) });
  const linkAlpha = presence(t, start + 750, DURATION_MS, 400);
  withScale(cx, y + 272, easeOutBack(progress(t, start + 750, start + 1250)), () => {
    pill(cx, y + 272, 700, 60, INK, { alpha: linkAlpha, shadow: false });
    text('github.com/heelee912/chiikawa-dots-pets', cx, y + 274, { size: 28, color: '#fff8ee', alpha: linkAlpha, font: FONT_EN, weight: 600 });
  });
  // an install line that types itself
  const cmd = 'irm …/chiikawa-dots-pets/main/install.ps1 | iex';
  const shown = Math.floor(progress(t, start + 1250, start + 2750) * cmd.length);
  text('> ' + cmd.slice(0, shown) + (Math.floor(t / 400) % 2 ? '▏' : ''), cx, y + 334, { size: 24, color: '#8b7a70', alpha: presence(t, start + 1200, DURATION_MS, 300), font: '"Consolas", "Menlo", monospace', weight: '' });
}

// ---------- captions ----------
function caption(t, inMs, outMs, str, { x = W / 2, y = 130, align = 'center', size = 60, maxWidth = 1500 } = {}) {
  const alpha = presence(t, inMs, outMs, 450);
  if (alpha <= 0) return;
  const rise = (1 - easeOutCubic(progress(t, inMs, inMs + 600))) * 24;
  text(str, x, y + rise, { size: fitSize(str, size, maxWidth), alpha, align });
}
function introTitle(t) {
  const alpha = presence(t, T.titleIn, T.carouselOut + 150, 450);
  if (alpha <= 0) return;
  const word = 'Chiikawa Dots Pets';
  ctx.save(); ctx.font = `700 96px ${FONT_EN}`;
  const widths = [...word].map(ch => ctx.measureText(ch).width);
  let x = WIN.x;
  [...word].forEach((ch, i) => {
    const k = easeOutBack(progress(t, T.titleIn + i * 30, T.titleIn + i * 30 + 540));
    ctx.globalAlpha = alpha * clamp01(k * 1.5); ctx.fillStyle = INK; ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, 250 + (1 - k) * -40); x += widths[i];
  });
  ctx.restore();
  text(COPY.subtitle, WIN.x, 340, { size: 36, color: INK_SOFT, align: 'left', alpha: presence(t, T.titleIn + 700, T.carouselOut + 150, 450) });
}
function drawStateDots(t) {
  const current = deskStateAt(t);
  if (!current) return;
  const alpha = presence(t, T.castPop - 300, T.minimize, 450);
  const widths = DESK_STATES.map(s => s === current ? 30 : 14), gap = 12;
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1)) / 2;
  DESK_STATES.forEach((s, i) => {
    const on = s === current;
    ctx.save(); ctx.globalAlpha = alpha * (on ? 1 : 0.35); ctx.fillStyle = on ? STATE_COLORS[s.state] : '#cdbbb0';
    roundRect(x, 242, widths[i], 12, 6); ctx.fill(); ctx.restore();
    x += widths[i] + gap;
  });
}

// ---------- Chiikawa perched on the window at the start ----------
let perchTrack = null;
function perchActorsAt(t) {
  if (t < T.chiikawaPop || t >= T.carouselOut + 520) return [];
  return [{ id: 'chiikawa', ...cellFor('chiikawa', segmentAt(perchTrack, t), t), x: PERCH_X, y: windowTop(t), scale: 2 }];
}

// ---------- roll call carousel ----------
const CAROUSEL = { y: 800, spacing: 470, holdMs: 600, glideMs: 300 };
function carouselTravel(t) {
  const local = t - T.carousel - 300;
  if (local <= 0) return 0;
  const step = CAROUSEL.holdMs + CAROUSEL.glideMs;
  const k = Math.floor(local / step), inStep = local - k * step;
  const glide = inStep < CAROUSEL.holdMs ? 0 : easeInOutCubic((inStep - CAROUSEL.holdMs) / CAROUSEL.glideMs);
  return Math.min(IDS.length - 1, k + glide);
}
function carouselAlpha(t) { return Math.min(easeOutCubic(progress(t, T.carousel, T.carousel + 450)), 1 - easeInCubic(progress(t, T.carouselEnd - 450, T.carouselEnd))); }
function carouselActorsAt(t) {
  if (t < T.carousel || t >= T.carouselEnd) return [];
  const travel = carouselTravel(t);
  return IDS.map((id, i) => ({ id, row: ROWS.waving, column: columnAt(CAST[id].holdsMs.waving, t - T.carousel), x: Math.round(W / 2 + (i - travel) * CAROUSEL.spacing), y: CAROUSEL.y + Math.round((1 - carouselAlpha(t)) * 30), scale: 2, dim: Math.abs(i - travel) }))
    .filter(a => a.x > -260 && a.x < W + 260);
}
function drawCarousel(t) {
  if (t < T.carousel || t >= T.carouselEnd) return;
  const alpha = carouselAlpha(t);
  const travel = carouselTravel(t), focus = Math.round(travel), pet = CAST[IDS[focus]];
  ctx.save(); ctx.globalAlpha = alpha;
  const glow = ctx.createRadialGradient(W / 2, CAROUSEL.y - 180, 30, W / 2, CAROUSEL.y - 180, 330);
  glow.addColorStop(0, 'rgba(255,255,255,0.95)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = alpha * (0.35 + 0.35 * clamp01(1 - Math.abs(travel - focus) * 2));
  ctx.strokeStyle = pet.color; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(W / 2, CAROUSEL.y - 190, 230, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  for (const a of carouselActorsAt(t)) {
    ctx.save(); ctx.globalAlpha = alpha * (1 - clamp01((a.dim - 1.2) / 1.6) * 0.55);
    shadow(a.x, CAROUSEL.y, 2); drawCell(a.id, a.row, a.column, a.x, a.y, 2);
    ctx.restore();
  }
  const stepStart = T.carousel + 300 + focus * (CAROUSEL.holdMs + CAROUSEL.glideMs) - CAROUSEL.glideMs / 2;
  const pop = easeOutBack(progress(t, stepStart, stepStart + 380));
  const cardY = CAROUSEL.y + 92;
  withScale(W / 2, cardY, 0.6 + 0.4 * pop, () => {
    pill(W / 2, cardY, 440, 110, '#ffffff', { alpha, stroke: pet.color });
    const name = COPY.name(pet);
    text(name, W / 2, cardY - 16, { size: fitSize(name, 50, 380), alpha, weight: LANG === 'ko' ? '' : 700 });
    text(COPY.sub(pet), W / 2, cardY + 30, { size: 24, color: INK_SOFT, alpha, font: LANG === 'en' ? FONT_JA : FONT_EN, weight: 600 });
  });
  text(`${String(focus + 1).padStart(2, '0')} / ${IDS.length}`, W / 2 + 330, cardY - 36, { size: 26, color: pet.color, alpha, font: FONT_EN, weight: 700 });
}

// ---------- the whole cast at 1x: beside the window, then gathered in the middle ----------
// Beside the window: six on the left and five on the right, each side a gently zigzagging column.
const COLUMN_STEP_Y = 108;
const HOME = {};
['chiikawa', 'hachiware', 'usagi', 'momonga', 'shisa', 'rakko'].forEach((id, k) => { HOME[id] = { x: k % 2 ? 150 : 290, y: 335 + k * COLUMN_STEP_Y }; });
['kurimanju', 'siren', 'furuhonya', 'anoko', 'dekatsuyo'].forEach((id, k) => { HOME[id] = { x: k % 2 ? 1770 : 1630, y: 389 + k * COLUMN_STEP_Y }; });
// In the middle: three loose rows with a little irregular spacing, left pets on the left half.
const SPOT = {
  usagi: { x: 585, y: 605 }, hachiware: { x: 815, y: 617 }, kurimanju: { x: 1105, y: 607 }, siren: { x: 1340, y: 617 },
  momonga: { x: 690, y: 757 }, chiikawa: { x: 960, y: 743 }, furuhonya: { x: 1232, y: 755 },
  rakko: { x: 560, y: 893 }, shisa: { x: 842, y: 885 }, anoko: { x: 1080, y: 895 }, dekatsuyo: { x: 1362, y: 887 },
};
const RUN_SPEED = 0.46;   // px per ms at 1x
const MOVES = {};
function buildCast() {
  for (const id of IDS) {
    const home = HOME[id], spot = SPOT[id];
    const runState = spot.x > home.x ? 'running-right' : 'running-left';
    const events = [...DESK_STATES.map(s => ({ t: s.at, state: s.state, mode: 'now' })), { t: T.runCue, state: runState, mode: 'cycle' }];
    const runStart = buildTrack(id, events).at(-1).start;
    // the trip lasts whole run cycles, so the pet stops exactly at the end of a stride
    const cycle = cycleMs(id, runState);
    const arrive = runStart + Math.max(1, Math.round(Math.hypot(spot.x - home.x, spot.y - home.y) / RUN_SPEED / cycle)) * cycle;
    const jumpEnd = T.finale + 2 * cycleMs(id, 'jumping');
    events.push(
      { t: arrive, state: 'look', mode: 'now' },
      { t: T.finale, state: 'jumping', mode: 'now' },        // everyone jumps on the same beat, twice
      { t: jumpEnd, state: 'waving', mode: 'cycle' },
    );
    MOVES[id] = { home, spot, runStart, arrive, track: buildTrack(id, events) };
  }
}
function castPosition(move, t) {
  const k = progress(t, move.runStart, move.arrive);
  return { x: Math.round(lerp(move.home.x, move.spot.x, k)), y: Math.round(lerp(move.home.y, move.spot.y, k)) };
}

// The cursor glides through hand-placed waypoints (time ms, x, y); it eases to a stop where a point repeats.
const CURSOR_PATH = [
  [T.cursorIn, 2010, 940],
  [26150, MINIMIZE_BUTTON.x, MINIMIZE_BUTTON.y], [26400, MINIMIZE_BUTTON.x, MINIMIZE_BUTTON.y],
  [27700, 960, 420], [28700, 1480, 430], [29600, 1660, 800], [30500, 1240, 1020], [31400, 760, 735],
  [32300, 330, 900], [33200, 270, 400], [34100, 960, 470], [35000, 1330, 300],
  [35800, W / 2, 230], [T.finale + 300, W / 2, 230],
];
const CLICKS = [T.minimize, T.finale];
function cursorVelocity(i) {
  const p = CURSOR_PATH;
  if (i === 0 || i === p.length - 1) return [0, 0];
  const same = (a, b) => a[1] === b[1] && a[2] === b[2];
  if (same(p[i], p[i - 1]) || same(p[i], p[i + 1])) return [0, 0];
  const span = p[i + 1][0] - p[i - 1][0];
  return [(p[i + 1][1] - p[i - 1][1]) / span, (p[i + 1][2] - p[i - 1][2]) / span];
}
function cursorAt(t) {
  const p = CURSOR_PATH;
  if (t <= p[0][0]) return { x: p[0][1], y: p[0][2] };
  let i = 0;
  while (i < p.length - 2 && t >= p[i + 1][0]) i++;
  const d = p[i + 1][0] - p[i][0], u = clamp01((t - p[i][0]) / d);
  const v0 = cursorVelocity(i), v1 = cursorVelocity(i + 1);
  const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
  return {
    x: h00 * p[i][1] + h10 * d * v0[0] + h01 * p[i + 1][1] + h11 * d * v1[0],
    y: h00 * p[i][2] + h10 * d * v0[1] + h01 * p[i + 1][2] + h11 * d * v1[1],
  };
}
// Each pet looks at the cursor from where it stands (row 9 holds 000-157.5 degrees, row 10 the rest).
function lookCell(position, t) {
  const c = cursorAt(t), headY = position.y - 85;
  if (Math.hypot(c.x - position.x, c.y - headY) < 60) return { row: ROWS.idle, column: 0 };
  const degrees = (Math.atan2(c.x - position.x, -(c.y - headY)) * 180 / Math.PI + 360) % 360;
  const index = Math.round(degrees / 22.5) % 16;
  return { row: 9 + Math.floor(index / 8), column: index % 8 };
}
function castActorsAt(t) {
  if (t < T.castPop) return [];
  const fade = 1 - easeInCubic(progress(t, DURATION_MS - 650, DURATION_MS - 80));
  return IDS.map(id => {
    const move = MOVES[id], seg = segmentAt(move.track, t), position = castPosition(move, t);
    const look = seg.state === 'look' ? lookCell(position, t) : null;
    return { id, ...cellFor(id, seg, t, look), ...position, scale: 1, alpha: fade, running: seg.state.startsWith('running-') };
  }).sort((a, b) => a.y - b.y);
}
// dust puffs come from the pet's own past positions; nothing is stored
function drawDust(id, t) {
  const move = MOVES[id];
  const dx = move.spot.x - move.home.x, dy = move.spot.y - move.home.y, length = Math.hypot(dx, dy);
  for (let spawn = move.runStart + 80; spawn < Math.min(t, move.arrive); spawn += 140) {
    const age = t - spawn;
    if (age > 520) continue;
    const k = age / 520, p = castPosition(move, spawn), back = 46 + k * 24;
    ctx.save(); ctx.globalAlpha = (1 - k) * 0.6; ctx.fillStyle = '#ecdcd0';
    ctx.beginPath(); ctx.arc(p.x - dx / length * back, p.y - dy / length * back - 4 - k * 16, 5 + k * 11, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function drawCursor(t) {
  const alpha = presence(t, T.cursorIn, T.finale + 700, 300);
  if (alpha <= 0) return;
  const { x, y } = cursorAt(t);
  for (let i = 1; i <= 8; i++) {
    const p = cursorAt(t - i * 30);
    ctx.save(); ctx.globalAlpha = alpha * (1 - i / 9) * 0.35; ctx.fillStyle = '#f6b8c3';
    ctx.beginPath(); ctx.arc(p.x + 4, p.y + 6, 11 - i, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  for (const at of CLICKS) {
    const k = progress(t, at, at + 420);
    if (k <= 0 || k >= 1) continue;
    ctx.save(); ctx.globalAlpha = alpha * (1 - k); ctx.strokeStyle = '#f29bb0'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, 10 + easeOutCubic(k) * 36, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  const press = CLICKS.some(at => t >= at - 60 && t < at + 90) ? 0.88 : 1;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(1.8 * press, 1.8 * press);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(9, 26); ctx.lineTo(15, 39); ctx.lineTo(21, 36); ctx.lineTo(15, 23); ctx.lineTo(26, 23); ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

// ---------- composition ----------
function renderAt(t) {
  t = ((t % DURATION_MS) + DURATION_MS) % DURATION_MS;
  desktop();
  introTitle(t);
  drawWindow(t);
  for (const a of perchActorsAt(t)) { shadow(a.x, a.y, 2); drawCell(a.id, a.row, a.column, a.x, a.y, 2); }
  drawCarousel(t);
  for (const a of castActorsAt(t)) {
    if (a.running) drawDust(a.id, t);
    ctx.save(); ctx.globalAlpha = a.alpha; shadow(a.x, a.y, 1, a.alpha); drawCell(a.id, a.row, a.column, a.x, a.y, 1); ctx.restore();
  }
  // puffs: Chiikawa arriving on the window, then the whole cast at every state change
  puff(PERCH_X, windowTop(T.chiikawaPop), 2, t, T.chiikawaPop);
  for (const s of DESK_STATES) for (const id of IDS) puff(HOME[id].x, HOME[id].y, 0.9, t, s.at);
  drawCursor(t);

  caption(t, T.carousel + 100, T.carouselEnd - 100, COPY.meet, { y: 170, size: 58 });
  caption(t, T.castPop - 300, T.minimize, COPY.states, { y: 180, size: 56, maxWidth: 1000 });
  drawStateDots(t);
  caption(t, 27600, T.finale - 200, COPY.look, { y: 140, size: 58, maxWidth: 1200 });
  text(COPY.footer, W / 2, H - 24, { size: 18, color: '#c2b1a6', alpha: 0.9 * presence(t, 0, DURATION_MS - 60, 400), font: `${FONT_EN.split(',')[0]}, ${COPY.font}`, weight: 600 });
}

// render.py uses this to land GIF frames exactly on sprite changes.
function spriteSignatureAt(t) {
  return [...perchActorsAt(t), ...carouselActorsAt(t), ...castActorsAt(t)].map(a => `${a.id}${a.row}.${a.column}`).join('|');
}

async function load() {
  const data = await (await fetch('cast.json')).json();
  for (const p of data.cast) CAST[p.id] = { ...p, nameJa: JA_NAMES[p.id], nameKo: KO_NAMES[p.id] };
  await Promise.all(IDS.map(id => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { sheets[id] = img; resolve(); };
    img.onerror = () => reject(new Error(`missing spritesheet for ${id}`));
    img.src = `../pets/${id}/spritesheet.png`;
  })));
  perchTrack = buildTrack('chiikawa', [{ t: T.chiikawaPop, state: 'idle', mode: 'now' }, { t: T.chiikawaPop + 1200, state: 'waving', mode: 'cycle' }, { t: T.chiikawaPop + 1201, state: 'idle', mode: 'cycle' }]);
  buildCast();
  const strings = [COPY.subtitle, COPY.meet, COPY.states, COPY.look, COPY.outro, COPY.footer, COPY.ask, COPY.yes, COPY.no,
    COPY.failedLine, COPY.doneLine, ...Object.values(COPY.chip), ...IDS.map(id => COPY.name(CAST[id]) + COPY.sub(CAST[id]))].join('');
  await Promise.all([
    document.fonts.load(`60px ${COPY.font}`, strings),
    document.fonts.load(`700 60px ${COPY.font}`, strings),
    document.fonts.load(`600 40px ${FONT_EN}`, strings + 'Chiikawa Dots Pets my-project github.com 0123456789/ ✓×'),
    document.fonts.load(`700 80px ${FONT_EN}`, 'Chiikawa Dots Pets 0123456789/ ✓×'),
    document.fonts.load(`600 24px ${FONT_JA}`, Object.values(JA_NAMES).join('')),
  ]);
  await document.fonts.ready;
  return true;
}

window.PROMO_DURATION_MS = DURATION_MS;
window.renderAt = renderAt;
window.spriteSignatureAt = spriteSignatureAt;
window.promoReady = load();
document.documentElement.lang = LANG;

if (!params.has('export')) {
  window.promoReady.then(() => {
    const startedAt = performance.now();
    const tick = now => { renderAt(now - startedAt); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
